name: Build CV PDF

on:
  push:
    branches:
      - agent/update-research-profile
    paths:
      - "cv/rongfeng-cheng-cv.tex"
      - ".github/workflows/build-cv-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile ModernCV with XeLaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: rongfeng-cheng-cv.tex
          working_directory: cv
          latexmk_use_xelatex: true

      - name: Replace website PDF
        run: cp cv/rongfeng-cheng-cv.pdf public/cv/cheng-rongfeng-cv.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/cv/cheng-rongfeng-cv.pdf
          if git diff --cached --quiet; then
            echo "PDF is already up to date."
            exit 0
          fi
          git commit -m "Sync generated CV PDF [skip ci]"
          git push origin HEAD:agent/update-research-profile
